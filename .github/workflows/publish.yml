# Builds the two images the server runs and pushes them to GHCR.
#
# The application and the proxy that fronts it are released together under one
# tag, so a redeploy can never pair new templates with an old Caddyfile. The
# package is private, like the repository; Portainer authenticates to ghcr.io
# with a personal access token carrying `read:packages`.
#
# This workflow does not run the test suite — the gates are run locally before a
# release, per docs/HANDOFF.md §7. `latest` therefore follows `main` whatever
# state it is in; pin IMAGE_TAG to a sha- tag in Portainer if that matters.

name: publish

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ghcr.io/dmkdok/personal-site
            dockerfile: Dockerfile
          - image: ghcr.io/dmkdok/personal-site-caddy
            dockerfile: Dockerfile.caddy

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          # TrueNAS Scale is x86-64. A second architecture would roughly double
          # the build for a platform nothing here runs on.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
