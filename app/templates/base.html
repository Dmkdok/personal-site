<!doctype html>
<html lang="{{ lang }}"{% if theme_attr %} data-theme="{{ theme_attr }}"{% endif %}>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    {# htmx would otherwise inject a <style> element, which our CSP forbids.
       The indicator rules live in components.css instead. #}
    <meta name="htmx-config" content='{"includeIndicatorStyles": false}' />

    {# Applied before first paint so neither the theme nor the owner's reveal
       state flashes. `show-edits` is a class rather than a data attribute
       because the stylesheet keys ten selectors off it. #}
    <script nonce="{{ request.state.csp_nonce }}">
      (function () {
        try {
          var t = localStorage.getItem("theme");
          if (t === "dark" || t === "light") document.documentElement.dataset.theme = t;
          if (localStorage.getItem("show-edits") === "1") {
            document.documentElement.classList.add("show-edits");
          }
        } catch (e) {}
      })();
    </script>

    <title>{% block title %}{{ t("site.name") }}{% endblock %}</title>
    <meta name="description" content="{% block meta_description %}{{ t("site.tagline") }}{% endblock %}" />
    {# On a bounded index the canonical is the page's own address, not the
       first page's: page 2 is its own document, and pointing it at page 1
       would ask a crawler to drop eleven articles (SPEC F52). #}
    <link rel="canonical" href="{% block canonical %}{{ site_url }}{{ page_url(request.url.path, page.number) if page else request.url.path }}{% endblock %}" />
    {% if page %}
      {% if page.previous %}
        <link rel="prev" href="{{ site_url }}{{ page_url(request.url.path, page.previous) }}" />
      {% endif %}
      {% if page.next %}
        <link rel="next" href="{{ site_url }}{{ page_url(request.url.path, page.next) }}" />
      {% endif %}
    {% endif %}

    <meta property="og:type" content="{% block og_type %}website{% endblock %}" />
    <meta property="og:site_name" content="{{ t('site.name') }}" />
    <meta property="og:title" content="{{ self.title() }}" />
    <meta property="og:description" content="{{ self.meta_description() }}" />
    <meta property="og:url" content="{{ self.canonical() }}" />
    {% block og_image %}{% include "partials/og_image.html" %}{% endblock %}
    <meta name="twitter:card" content="summary_large_image" />

    {# The «Dm» mark. The SVG carries its own light/dark switch; the PNG is for
       the browsers that will not take an SVG, and `/favicon.ico` at the root is
       for the ones that never look here at all. All self-hosted, so the CSP is
       untouched. #}
    <link rel="icon" href="{{ static_url('icons/favicon.svg') }}" type="image/svg+xml" />
    <link rel="icon" href="{{ static_url('icons/favicon-32.png') }}" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="{{ static_url('icons/apple-touch-icon.png') }}" />

    <link rel="preload" href="{{ static_url('fonts/onest-cyrillic.woff2') }}" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="{{ static_url('css/base.css') }}" />
    <link rel="stylesheet" href="{{ static_url('css/tokens.css') }}" />
    <link rel="stylesheet" href="{{ static_url('css/layout.css') }}" />
    <link rel="stylesheet" href="{{ static_url('css/components.css') }}" />
    {% if is_admin %}
      <link rel="stylesheet" href="{{ static_url('css/admin.css') }}" />
    {% endif %}
    {% block head_extra %}{% endblock %}
  </head>

  {# `is-admin` is the one signal in the document that says it belongs to a
     signed-in owner. It used to carry the clearance for the fixed admin bar
     (UI-AUDIT F-015); the bar is gone and so is the clearance (ADR-027), and
     what the class is for now is telling the two accessibility sweeps that they
     really did run signed in rather than quietly measuring the public page.
     A visitor's HTML never carries it. #}
  <body
    {% set classes = ([body_class] if body_class else []) + (["is-admin"] if is_admin else []) %}
    {% if classes %}class="{{ classes|join(' ') }}"{% endif %}
    hx-headers='{"X-CSRF-Token": "{{ csrf_token }}"}'
  >
    <a class="skip-link" href="#main">{{ t("site.skip") }}</a>

    <div class="page">
      {% include "partials/nav.html" %}

      <main class="page__main" id="main" tabindex="-1">
        {% block content %}{% endblock %}
      </main>

      {% include "partials/footer.html" %}
    </div>

    {# `ui.js` reads its messages from here. Data attributes rather than an
       inline script: the CSP forbids one, and this keeps every user-visible
       string in the catalogue where ADR-007 says it belongs.

       Two regions, not one (UI-AUDIT F-007). `role="alert"` on the shared host
       would make every «Сохранено» interrupt whatever a screen reader was
       saying; on its own region it interrupts only for the messages that have
       earned it. Both are in the DOM from first paint, because a live region
       created at the same moment as its content is a live region that may
       never be announced. #}
    <div
      class="toast-host"
      id="toasts"
      data-msg-expired="{{ t('errors.session_expired') }}"
      data-msg-stale="{{ t('errors.stale_page') }}"
      data-msg-failed="{{ t('errors.save_failed') }}"
      data-msg-offline="{{ t('errors.offline') }}"
      data-msg-dismiss="{{ t('errors.dismiss') }}"
    >
      <div class="toast-region" id="toasts-polite" aria-live="polite" aria-atomic="false"></div>
      <div class="toast-region" id="toasts-alert" role="alert"></div>
    </div>

    <script src="{{ static_url('js/vendor/htmx.min.js') }}" defer></script>
    <script src="{{ static_url('js/theme.js') }}" defer></script>
    <script src="{{ static_url('js/nav.js') }}" defer></script>
    <script src="{{ static_url('js/ui.js') }}" defer></script>
    {% if is_admin %}
      <script src="{{ static_url('js/edits.js') }}" defer></script>
    {% endif %}
    {% block scripts %}{% endblock %}
  </body>
</html>
