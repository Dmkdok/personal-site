{# The capsule: the one object present on every page. #}
<nav class="nav" aria-label="{{ t('nav.menu') }}">
  <div class="nav__capsule">
    <button
      class="icon-button nav__toggle"
      type="button"
      data-nav-toggle
      aria-expanded="false"
      aria-controls="nav-links"
    >
      <span class="visually-hidden">{{ t("nav.menu") }}</span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
        <path d="M4 7h16M4 12h16M4 17h16" />
      </svg>
    </button>

    <ul class="nav__links" id="nav-links" role="list">
      {% set sections = [
        ("home", "/", t("nav.home")),
        ("dev", "/dev", t("nav.dev")),
        ("photo", "/photo", t("nav.photo")),
        ("blog", "/blog", t("nav.blog")),
      ] %}
      {% for key, href, label in sections %}
        <li>
          <a
            class="nav__link"
            href="{{ href }}"
            {% if active_section == key %}aria-current="page"{% endif %}
          >{{ label }}</a>
        </li>
      {% endfor %}
    </ul>

    <span class="nav__divider" aria-hidden="true"></span>

    <form class="nav__search" action="/search" method="get" role="search">
      <label class="search-field">
        <span class="visually-hidden">{{ t("nav.search_label") }}</span>
        <svg class="search-field__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <circle cx="11" cy="11" r="7" />
          <path d="m20 20-3.5-3.5" />
        </svg>
        <input
          class="search-field__input"
          type="search"
          name="q"
          value="{{ query|default('', true) }}"
          placeholder="{{ t('nav.search_placeholder') }}"
          autocomplete="off"
        />
      </label>
    </form>

    <button class="icon-button" type="button" data-theme-toggle aria-pressed="false">
      <span class="visually-hidden">{{ t("nav.theme_label") }}</span>
      <svg class="theme-toggle__moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z" />
      </svg>
      <svg class="theme-toggle__sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
        <circle cx="12" cy="12" r="4" />
        <path d="M12 3v2m0 14v2M3 12h2m14 0h2M5.6 5.6l1.4 1.4m10 10 1.4 1.4m0-12.8-1.4 1.4m-10 10-1.4 1.4" />
      </svg>
    </button>
  </div>
</nav>
