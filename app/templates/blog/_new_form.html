{# Opened in place of the «Новая статья» button. A successful POST answers with
   204 + HX-Redirect, so nothing is swapped: the browser goes to the editor. #}
<form
  class="blog-new blog-new--open"
  id="blog-new"
  hx-post="/blog/admin/posts"
  hx-target="#blog-new"
  hx-swap="outerHTML"
>
  <div class="field">
    <label class="field__label" for="new-post-title">{{ t("blog.new_title_label") }}</label>
    <input
      class="field__input"
      id="new-post-title"
      name="title"
      type="text"
      maxlength="250"
      placeholder="{{ t('blog.new_title_placeholder') }}"
      aria-describedby="new-post-hint"
      data-autofocus
    />
    <p class="field__hint" id="new-post-hint">{{ t("blog.new_hint") }}</p>
  </div>

  <div class="blog-new__actions">
    <button class="button button--primary" type="submit">{{ t("blog.new_submit") }}</button>
    <button
      class="button button--quiet"
      type="button"
      hx-get="/blog/admin/new/cancel"
      hx-target="#blog-new"
      hx-swap="outerHTML"
    >{{ t("blog.new_cancel") }}</button>
  </div>
</form>
