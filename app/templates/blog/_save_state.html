{# The *inner* content of #save-state.
   Swapped with innerHTML so the live region around it survives every save and
   screen readers actually announce the new text. #}
<span class="editor-status__text" data-status-text>{{ saved_label or "" }}</span>
<a class="editor-status__link" href="/blog/{{ post.slug }}">{{ t("blog.open") }}</a>
