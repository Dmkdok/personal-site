# Production overlay. Use together with the base file:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Differences from local: Caddy terminates TLS, the app and database are not
# published on the host, the code is baked into the image instead of mounted,
# and ENV=production makes session cookies Secure.

services:
  db:
    ports: !override []

  web:
    ports: !override []
    environment:
      ENV: production
    volumes: !override
      - ${MEDIA_HOST_DIR:-./data/media}:/data/media
    # `--forwarded-allow-ips` must name the proxy, never "*". With "*" uvicorn
    # rewrites the peer address from any client's own `X-Forwarded-For`, which
    # hands the login throttle (F17) a fresh budget on every attempt. The
    # default is Docker's private bridge range, which on this stack is Caddy
    # and nothing else; override it if the deployment uses another pool.
    command:
      ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers",
       "--forwarded-allow-ips", "${TRUSTED_PROXY_IPS:-172.16.0.0/12}"]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      # A domain here means Caddy terminates TLS itself. Behind a proxy that
      # already does — the TrueNAS deployment, see deploy/portainer-stack.yml —
      # it is a bare port instead.
      CADDY_SITE_ADDRESS: ${CADDY_SITE_ADDRESS:?set CADDY_SITE_ADDRESS in .env, e.g. dmkdok.ru}
      CADDY_TRUSTED_PROXIES: ${CADDY_TRUSTED_PROXIES:-private_ranges}

volumes:
  caddy_data:
  caddy_config:
